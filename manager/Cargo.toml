[package]
name = "desk-manager"
version = "0.2.0"
edition = "2021"
description = "Tiny terminal manager for claude-desk: window list, live previews (sixel or half-blocks), resize, desktop switch"
license = "MIT"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
png = "0.17"
rustix = { version = "1", default-features = false, features = ["termios", "stdio", "std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
