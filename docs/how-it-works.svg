<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, sans-serif" font-size="14">
  <style>
    .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
    .desk{fill:#eef6ff;stroke:#0969da;stroke-width:2}
    .app{fill:#fff;stroke:#0969da;stroke-width:1.5}
    .t{fill:#24292f} .s{fill:#57606a;font-size:12px} .h{font-weight:600}
    .a{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <rect class="box" x="20" y="30" width="190" height="130" rx="8"/>
  <text class="t h" x="115" y="58" text-anchor="middle">AI agent</text>
  <text class="s" x="115" y="82" text-anchor="middle">runs shell commands</text>
  <text class="s" x="115" y="102" text-anchor="middle">desk shot / click / type</text>
  <text class="s" x="115" y="122" text-anchor="middle">desk run / chromium</text>
  <text class="s" x="115" y="142" text-anchor="middle">cdp-eval.mjs (read text)</text>

  <rect class="box" x="20" y="300" width="190" height="130" rx="8"/>
  <text class="t h" x="115" y="328" text-anchor="middle">Your real session</text>
  <text class="s" x="115" y="352" text-anchor="middle">your pointer, focus,</text>
  <text class="s" x="115" y="372" text-anchor="middle">windows, browser</text>
  <text class="t" x="115" y="402" text-anchor="middle" font-weight="600">never touched</text>

  <rect class="desk" x="270" y="20" width="610" height="430" rx="10"/>
  <text class="t h" x="285" y="46">desk: nested labwc compositor (headless by default)</text>
  <text class="s" x="285" y="64">own Wayland display, own D-Bus, no DISPLAY, stripped PATH</text>

  <rect class="app" x="290" y="85" width="270" height="150" rx="6"/>
  <text class="t h" x="305" y="108">desktop 1: web</text>
  <text class="s" x="305" y="130">Chromium (own profile)</text>
  <text class="s" x="305" y="150">CDP on 127.0.0.1:9222</text>
  <text class="s" x="305" y="170">maximized by window rule</text>

  <rect class="app" x="590" y="85" width="270" height="150" rx="6"/>
  <text class="t h" x="605" y="108">desktop 2: term</text>
  <text class="s" x="605" y="130">foot + fish, maximized</text>
  <text class="s" x="605" y="150">desk ws 2   (Super+2)</text>

  <rect class="app" x="290" y="255" width="270" height="110" rx="6"/>
  <text class="t h" x="305" y="278">desktop 3: apps</text>
  <text class="s" x="305" y="300">Krita, Blender, Inkscape,</text>
  <text class="s" x="305" y="320">Godot, LibreOffice ... (desk run)</text>

  <rect class="app" x="590" y="255" width="270" height="110" rx="6"/>
  <text class="t h" x="605" y="278">desktop 4: scratch</text>
  <text class="s" x="605" y="300">anything else</text>

  <text class="s" x="285" y="395">tools inside: grim (screenshots) · wtype (keys, text) · wlrctl (pointer, window list)</text>
  <text class="s" x="285" y="415">optional: wayvnc (desk watch) so you can look at it, view-only by default</text>
  <text class="s" x="285" y="435">one desk is shared: switch desktops briefly, then desk ws 1</text>

  <path class="a" d="M210,95 H270"/>
  <text class="s" x="240" y="88" text-anchor="middle">commands</text>
  <path class="a" d="M270,130 H215" stroke-dasharray="4 3"/>
  <text class="s" x="240" y="152" text-anchor="middle">PNG / text</text>
</svg>
